name: Build Android APK # Includes four-player rule and UI regression checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "engine/**"
      - "engines/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate six-player UI and Android asset sync
        run: |
          node --check kuwaiti-six-player-ui.js
          node --check lan-multiplayer.js
          cmp lan-multiplayer.js android/app/src/main/assets/lan-multiplayer.js
          cmp web-prototype.html android/app/src/main/assets/index.html
          node --check engines/kuwaiti-six-player/engine.js
          cmp kuwaiti-six-player-ui.js android/app/src/main/assets/kuwaiti-six-player-ui.js
          cmp engines/kuwaiti-six-player/engine.js android/app/src/main/assets/engines/kuwaiti-six-player/engine.js

      - name: Run JavaScript engine tests
        run: |
          node engine/test-kuwaiti-card-power.cjs
          node engines/test-engine-foundations.cjs
          node engines/test-standard-hokm.cjs
          node engines/test-four-player-ui.cjs
          node engines/test-browser-engine-load-order.cjs
          node engines/test-double-kout-sequence.cjs

      # Seed a fixed debug signing key once; subsequent CI builds restore it.
      - name: Create Android signing key if absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Keep the same key between CI builds so future APK updates install in place.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: doublekout-android-debug-signing-v1

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoubleKout-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
