name: Build Windows and iPhone web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-prototype.html"
      - "kuwaiti-six-player-ui.js"
      - "lan-multiplayer.js"
      - "supabase-multiplayer.js"
      - "anonymous-learning.js"
      - "engines/test-central-store.cjs"
      - "central-progress.js"
      - "central-store.js"
      - "central-payments-admin.js"
      - "three-d-scene.js"
      - "engines/**"
      - "scripts/**"
      - "supabase/**"
      - "desktop/**"
      - "package.json"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/cross-platform.yml"
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test four-player shared game engine
        run: node engines/test-double-kout-game.cjs
      - name: Test four-player UI and staged trump selection
        run: node engines/test-four-player-ui.cjs
      - name: Test standard four-player Hokm rules
        run: node engines/test-standard-hokm.cjs
      - name: Test anonymous strategy learning capture
        run: node engines/test-anonymous-learning.cjs
      - name: Test central cosmetic store
        run: node engines/test-central-store.cjs
      - name: Check central player progress module
        run: node --check central-progress.js
      - name: Check payment and admin console module
        run: node --check central-payments-admin.js
      - name: Test six-player Kuwaiti game lifecycle and auction handoff
        run: node engines/test-kuwaiti-six-player-game.cjs
      - name: Test six-player auction-to-card UI handoff
        run: node engines/test-kuwaiti-six-player-ui-handoff.cjs
      - name: Check embedded browser JavaScript
        run: node scripts/check-inline-js.cjs web-prototype.html
      - name: Build portable Windows EXE
        run: |
          npm install --no-audit --no-fund
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleKout-Windows-EXE
          path: dist-desktop/*.exe
          if-no-files-found: error

  supabase-online-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL with logical replication
        run: |
          docker run -d --name doublekout-pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16 -c wal_level=logical
          for i in {1..40}; do
            docker exec doublekout-pg pg_isready -U postgres && break
            sleep 1
          done
      - name: Prepare minimal Supabase auth schema
        run: |
          docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY, email text, email_confirmed_at timestamptz, raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb, raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb, is_anonymous boolean NOT NULL DEFAULT false);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS 'SELECT coalesce(nullif(current_setting(''request.jwt.claims'', true), '''')::jsonb, ''{}''::jsonb)';
          CREATE PUBLICATION supabase_realtime;
          SQL
      - name: Apply Supabase migrations in order
        run: |
          for file in supabase/migrations/20261113000100_multiplayer_rooms.sql supabase/migrations/20261113000200_room_lobby_actions.sql supabase/migrations/20261113000300_authoritative_four_player_game.sql supabase/migrations/20261114000400_reliable_room_lobby.sql supabase/migrations/20261114000500_deal_before_challenge_decision.sql supabase/migrations/20261114000600_rotating_challenge_turns.sql supabase/migrations/20261114000700_simultaneous_challenge_window.sql supabase/migrations/20261114000800_ten_second_turn_timeout.sql supabase/migrations/20261114000900_fix_challenge_extension_json.sql supabase/migrations/20261114001000_force_room_playing_status.sql supabase/migrations/20261114001100_fix_challenge_choice_json.sql supabase/migrations/20261114001200_challenger_starts_first.sql supabase/migrations/20261114001300_ten_second_challenge_window.sql supabase/migrations/20261114001400_fix_guest_room_playing_status.sql supabase/migrations/20261114001500_guest_team_selection.sql supabase/migrations/20261114001600_add_room_snapshot_rpc.sql supabase/migrations/20261114001700_allow_human_play_after_turn_timer.sql supabase/migrations/20261115001800_online_rematch_timer.sql supabase/migrations/20261115001900_online_trick_display_delay.sql supabase/migrations/20261115002000_lobby_decision_and_sequence_pile.sql supabase/migrations/20261116002100_anonymous_strategy_learning.sql supabase/migrations/20261116002200_central_player_progress.sql supabase/migrations/20261116002300_central_cosmetic_store.sql supabase/migrations/20261116002400_admin_payments.sql supabase/migrations/20261116002500_admin_player_history.sql supabase/migrations/20261116002600_two_points_per_win.sql supabase/migrations/20261117002700_online_staged_five_card_deal.sql supabase/migrations/20261117002800_idempotent_turns_and_ai_strategy.sql supabase/migrations/20261117002900_restore_online_timeout_and_trick_delay.sql supabase/migrations/20261118003000_first_card_timeout_and_ai_fallback.sql supabase/migrations/20261118003100_fix_initial_staged_deal_and_action_log.sql supabase/migrations/20261118003200_force_spades_first_online_game.sql supabase/migrations/20261118003300_fix_online_naras_rank_order.sql supabase/migrations/20261118101428_verified_accounts_and_room_player_scores.sql supabase/migrations/20261118180929_expert_online_ai_and_dealer_rotation.sql supabase/migrations/20261118182649_restrict_anon_execution_on_authenticated_rpcs.sql supabase/migrations/20261118184004_index_foreign_keys_and_optimize_auth_policies.sql; do
            docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Test central player points and leaderboard
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/player-progress-smoke.sql
      - name: Test cosmetic store purchases and card-back ownership
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cosmetic-store-smoke.sql
      - name: Test admin roles, manual payment approval and audit history
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin-payments-smoke.sql
      - name: Play a complete four-seat game with two humans and two AI seats
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/online-game-smoke.sql
      - name: Verify dealer and hakem rotation for ordinary wins, kout and both challenge outcomes
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/dealer-rotation-smoke.sql

  iphone-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble iPhone installable web app
        run: |
          mkdir -p dist-pwa/engines/standard-hokm dist-pwa/engines/kuwaiti-six-player
          cp web-prototype.html dist-pwa/index.html
          cp kuwaiti-six-player-ui.js three-d-scene.js lan-multiplayer.js supabase-multiplayer.js anonymous-learning.js central-progress.js central-store.js central-payments-admin.js IMG_3647.png manifest.webmanifest sw.js dist-pwa/
          cp engines/standard-hokm/engine.js dist-pwa/engines/standard-hokm/
          cp engines/kuwaiti-six-player/engine.js dist-pwa/engines/kuwaiti-six-player/
          cp engines/double-kout-sequence.js engines/double-kout-game.js dist-pwa/engines/
          cd dist-pwa
          zip -r ../DoubleKout-iPhone-PWA-0.8.56.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleKout-iPhone-PWA
          path: DoubleKout-iPhone-PWA-0.8.56.zip
          if-no-files-found: error
