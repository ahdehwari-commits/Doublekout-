name: Build Windows and iPhone web app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web-prototype.html"
      - "kuwaiti-six-player-ui.js"
      - "lan-multiplayer.js"
      - "three-d-scene.js"
      - "engines/**"
      - "scripts/**"
      - "supabase/**"
      - "desktop/**"
      - "package.json"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/cross-platform.yml"
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test four-player shared game engine
        run: node engines/test-double-kout-game.cjs
      - name: Check embedded browser JavaScript
        run: node scripts/check-inline-js.cjs web-prototype.html
      - name: Build portable Windows EXE
        run: |
          npm install --no-audit --no-fund
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleKout-Windows-EXE
          path: dist-desktop/*.exe
          if-no-files-found: error

  supabase-online-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL with logical replication
        run: |
          docker run -d --name doublekout-pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16 -c wal_level=logical
          for i in {1..40}; do
            docker exec doublekout-pg pg_isready -U postgres && break
            sleep 1
          done
      - name: Prepare minimal Supabase auth schema
        run: |
          docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';
          CREATE PUBLICATION supabase_realtime;
          SQL
      - name: Apply Supabase migrations in order
        run: |
          for file in supabase/migrations/20261113000100_multiplayer_rooms.sql supabase/migrations/20261113000200_room_lobby_actions.sql supabase/migrations/20261113000300_authoritative_four_player_game.sql supabase/migrations/20261114000400_reliable_room_lobby.sql supabase/migrations/20261114000500_deal_before_challenge_decision.sql supabase/migrations/20261114000600_rotating_challenge_turns.sql supabase/migrations/20261114000700_simultaneous_challenge_window.sql supabase/migrations/20261114000800_ten_second_turn_timeout.sql supabase/migrations/20261114000900_fix_challenge_extension_json.sql supabase/migrations/20261114001000_force_room_playing_status.sql supabase/migrations/20261114001100_fix_challenge_choice_json.sql supabase/migrations/20261114001200_challenger_starts_first.sql supabase/migrations/20261114001300_ten_second_challenge_window.sql; do
            docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Play a complete four-seat game with two humans and two AI seats
        run: docker exec -i doublekout-pg psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/online-game-smoke.sql

  iphone-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble iPhone installable web app
        run: |
          mkdir -p dist-pwa/engines/standard-hokm dist-pwa/engines/kuwaiti-six-player
          cp web-prototype.html dist-pwa/index.html
          cp kuwaiti-six-player-ui.js three-d-scene.js lan-multiplayer.js IMG_3647.png manifest.webmanifest sw.js dist-pwa/
          cp engines/standard-hokm/engine.js dist-pwa/engines/standard-hokm/
          cp engines/kuwaiti-six-player/engine.js dist-pwa/engines/kuwaiti-six-player/
          cp engines/double-kout-sequence.js engines/double-kout-game.js dist-pwa/engines/
          cd dist-pwa
          zip -r ../DoubleKout-iPhone-PWA-0.8.21.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleKout-iPhone-PWA
          path: DoubleKout-iPhone-PWA-0.8.21.zip
          if-no-files-found: error
